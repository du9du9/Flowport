<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="height:64px;"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:80;background:rgba(245,245,245,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e7e5e4;font-family:Inter,system-ui,sans-serif;">
  <div style="max-width:1200px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <a href="home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
      <span style="width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #a7e5d3, #a8c8e8 52%, #c8b8e0 100%);box-shadow:0 1px 4px rgba(41,37,36,0.12);"></span>
      <span style="font-size:17px;font-weight:600;letter-spacing:-0.02em;color:#292524;">FLOWPORT</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:34px;">
        <a href="features.dc.html" style="text-decoration:none;font-size:15px;color:#4e4e4e;" style-hover="color:#292524;">기능</a>
        <a href="pricing.dc.html" style="text-decoration:none;font-size:15px;color:#4e4e4e;" style-hover="color:#292524;">요금</a>
        <a href="features.dc.html#integrations" style="text-decoration:none;font-size:15px;color:#4e4e4e;" style-hover="color:#292524;">연동</a>
        <a href="contact.dc.html" style="text-decoration:none;font-size:15px;color:#4e4e4e;" style-hover="color:#292524;">문의</a>
      </nav>
      <div style="display:flex;align-items:center;gap:14px;flex-shrink:0;">
        <a href="contact.dc.html" style="text-decoration:none;font-size:15px;color:#292524;" style-hover="opacity:0.65;">로그인</a>
        <a href="contact.dc.html" style="text-decoration:none;font-size:15px;color:#ffffff;background:#292524;padding:9px 18px;border-radius:9999px;" style-hover="background:#0c0a09;">무료 체험</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="메뉴" style="width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:transparent;border:none;cursor:pointer;">
        <span style="width:20px;height:1.5px;background:#292524;display:block;"></span>
        <span style="width:20px;height:1.5px;background:#292524;display:block;"></span>
        <span style="width:20px;height:1.5px;background:#292524;display:block;"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #e7e5e4;padding:12px 24px 24px;display:flex;flex-direction:column;gap:4px;font-family:Inter,system-ui,sans-serif;">
      <a href="features.dc.html" style="text-decoration:none;font-size:18px;color:#292524;padding:12px 0;border-bottom:1px solid #f0efed;">기능</a>
      <a href="pricing.dc.html" style="text-decoration:none;font-size:18px;color:#292524;padding:12px 0;border-bottom:1px solid #f0efed;">요금</a>
      <a href="features.dc.html#integrations" style="text-decoration:none;font-size:18px;color:#292524;padding:12px 0;border-bottom:1px solid #f0efed;">연동</a>
      <a href="contact.dc.html" style="text-decoration:none;font-size:18px;color:#292524;padding:12px 0;border-bottom:1px solid #f0efed;">문의</a>
      <a href="contact.dc.html" style="text-decoration:none;text-align:center;font-size:15px;color:#ffffff;background:#292524;padding:12px 18px;border-radius:9999px;margin-top:14px;">무료 체험 시작</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;features&quot;,&quot;pricing&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 1200, menuOpen: false };
  componentDidMount() {
    this._onResize = () => this.setState({ w: window.innerWidth, menuOpen: window.innerWidth >= 860 ? false : this.state.menuOpen });
    this._onResize();
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  renderVals() {
    const mobile = this.state.w < 860;
    return {
      desktop: !mobile,
      mobile,
      menuOpen: mobile && this.state.menuOpen,
      toggle: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
